name: Build x86_64 Linux Kernel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          rsync \
          wget \
          pahole \
          git

    - name: Download Linux Kernel Source
      run: |
        # Latest stable or long-term kernel version (e.g., 6.6 or 6.12)
        KERNEL_VERSION="6.12.9"
        MAJOR_VERSION=$(echo $KERNEL_VERSION | cut -d. -f1)
        
        echo "Downloading kernel version v$KERNEL_VERSION..."
        wget https://cdn.kernel.org/pub/linux/kernel/v$MAJOR_VERSION.x/linux-$KERNEL_VERSION.tar.xz
        tar -xf linux-$KERNEL_VERSION.tar.xz
        mv linux-$KERNEL_VERSION linux-kernel
        ls -la linux-kernel

    - name: Configure Kernel
      run: |
        cd linux-kernel
        # Use default x86_64 configuration (defconfig)
        make defconfig
        
        # Optional: enable/disable options if needed, e.g. ensuring debugging symbols or specific features
        # scripts/config --disable SYSTEM_TRUSTED_KEYS
        # scripts/config --disable SYSTEM_REVOCATION_KEYS

    - name: Build Kernel
      run: |
        cd linux-kernel
        # Get number of CPU cores for parallel compilation
        CORES=$(nproc)
        echo "Building kernel using $CORES cores..."
        make -j$CORES bzImage
        make -j$CORES modules

    - name: Prepare Artifacts
      run: |
        mkdir -p kernel-artifacts
        cp linux-kernel/arch/x86/boot/bzImage kernel-artifacts/
        cp linux-kernel/.config kernel-artifacts/config
        
        # Optionally pack modules if built
        cd linux-kernel
        make INSTALL_MOD_PATH=../modroot modules_install
        cd ../modroot
        tar -czf ../kernel-artifacts/modules.tar.gz .
        cd ..
        
        ls -lh kernel-artifacts

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x86-linux-kernel-${{ github.run_number }}
        path: |
          kernel-artifacts/bzImage
          kernel-artifacts/config
          kernel-artifacts/modules.tar.gz
        retention-days: 7
